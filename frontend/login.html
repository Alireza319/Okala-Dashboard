<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKALA Corner — Sign in</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-logo">OKALA <span>CORNER PERFORMANCE</span></div><h1>Sign in</h1><p>Use your corporate email and password.</p><form id="f"><label>Corporate email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><div id="err" class="login-error"></div></form></div></div><script>f.onsubmit=async e=>{e.preventDefault();err.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error);location.href=d.user.mustChangePassword?'change-password.html':'index.html'}catch(x){err.textContent=x.message}}</script></body></html>
