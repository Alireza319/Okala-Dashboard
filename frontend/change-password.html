<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKALA Corner — Change password</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-logo">OKALA</div><h1>Set your password</h1><p>Choose a password of at least 10 characters.</p><form id="f"><label>Current password<input id="currentPassword" type="password" autocomplete="current-password"></label><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="10" required></label><button class="primary">Save password</button><div id="err" class="login-error"></div></form></div></div><script>f.onsubmit=async e=>{e.preventDefault();err.textContent='';if(newPassword.value!==confirm.value)return err.textContent='Passwords do not match.';try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error);location.href='index.html'}catch(x){err.textContent=x.message}}</script></body></html>
